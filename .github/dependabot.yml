# Flutter app + Go backend + Rust core (LiveKit voice)
version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - flutter
    groups:
      livekit:
        patterns:
          - "livekit*"
        update-types:
          - minor
          - patch
      rust-bridge:
        patterns:
          - "flutter_rust_bridge"
        update-types:
          - minor
          - patch
      flutter-platform:
        patterns:
          - "shared_preferences"
          - "connectivity_plus"
          - "path_provider"
          - "universal_io"
          - "flutter_callkit_incoming"
          - "flutter_foreground_task"
        update-types:
          - minor
          - patch
      ui-scan:
        patterns:
          - "qr_flutter"
          - "mobile_scanner"
        update-types:
          - minor
          - patch
      data:
        patterns:
          - "uuid"
          - "http"
          - "cryptography"
          - "clock"
          - "json_*"
          - "freezed*"
          - "rxdart"
          - "logging"
        update-types:
          - minor
          - patch
      dev-tooling:
        patterns:
          - "flutter_lints"
          - "build_runner"
          - "json_serializable"
          - "freezed"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    groups:
      livekit:
        patterns:
          - "github.com/livekit/*"
        update-types:
          - minor
          - patch
      auth:
        patterns:
          - "github.com/golang-jwt/*"
          - "github.com/google/uuid"
        update-types:
          - minor
          - patch
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    groups:
      rust-crates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
